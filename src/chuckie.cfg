# ld65 configuration of the Chuckie Egg port.
#
# The game keeps its variables at fixed addresses, as on the BBC Micro:
# zero page $00-$8F and pages $04-$07. The rest is the platform's.
MEMORY {
    ZPPLAT:  start = $0090, size = $0020, type = rw, file = "";
    ZPIRQ:   start = $00B0, size = $0010, type = rw, file = "";
    BSSPLAT: start = $0200, size = $0200, type = rw, file = "";
    MAIN:    start = $0800, size = $E800, type = rw, file = %O;
}
SEGMENTS {
    PLATZP:  load = ZPPLAT,  type = zp;
    IRQZP:   load = ZPIRQ,   type = zp;
    PLATBSS: load = BSSPLAT, type = bss;
    STARTUP: load = MAIN,    type = ro;
    GAME:    load = MAIN,    type = rw;
    CODE:    load = MAIN,    type = ro;
    RODATA:  load = MAIN,    type = ro;
}
